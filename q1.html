<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 4 - Question 1</title>
</head>
<body>
  <div id="myElement">
    <p>Welcome to my website!</p>
  </div>

  <script>
    // Change the text of the <p> inside #myElement
    function changeContent() {
      document.querySelector("#myElement p").innerHTML = "Hello there!";
    }

    // Run the function once the page has loaded
    changeContent();
  </script>
</body>
</html>
