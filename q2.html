<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 4 - Question 2</title>
</head>
<body>
  <input type="text" id="userInput" placeholder="Enter a number">
  <button onclick="checkInput()">Check</button>

  <script>
    // Validate the input and compare it with 10
    function checkInput() {
      // Get the value typed by the user and remove extra spaces
      let value = document.getElementById("userInput").value.trim();

      // Not a number (empty or alphabets/symbols)
      if (value === "" || isNaN(value)) {
        alert("Please insert a number!");
      }
      // Lower than 10
      else if (Number(value) < 10) {
        alert("The number is lower than 10");
      }
      // Otherwise (10 or higher)
      else {
        alert("The number is higher than 10");
      }
    }
  </script>
</body>
</html>
