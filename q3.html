<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 4 - Question 3</title>
</head>
<body>
  <p id="demo"></p>

  <script>
    let text = "";

    // Loop from 1 to 5
    for (let i = 1; i <= 5; i++) {
      text += "The number is " + i + "<br>";
    }

    // Display the result inside the <p>
    document.getElementById("demo").innerHTML = text;
  </script>
</body>
</html>
